
<!DOCTYPE html>
<html>
<head>
    <title>Q2 Seatwork 2</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            font-family: Arial;
            background-color: #f8f5e9;
        }

        .navbar {
            background-color: #526f62;
            padding: 10px;
        }

        .hours {
            background-color: #fffdf4;
            padding: 15px;
            margin-top: 15px;
        }

        .contact {
            background-color: #fffdf4;
            padding: 18px;
            border-radius: 5px;
        }

        h4 {
            text-align: center;
            margin-bottom: 20px;
            color: #526f62;
        }

        h5 {
            color: #526f62;
        }

        .btn {
            width: 100%;
            background-color: #83a995;
            border-color: #83a995;
        }

        .btn:hover {
            background-color: #648b77;
            border-color: #648b77;
        }

        table {
            font-size: 13px;
        }

        .table-primary {
            --bs-table-bg: #d5e9dc;
            --bs-table-color: #354d40;
        }

        .form-control {
            background-color: #faf9f1;
        }

    </style>
</head>

<body>

    <nav class="navbar navbar-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">🌿 Contact Us</a>

            <form class="d-flex">
                <input class="form-control me-2" type="search" placeholder="Search">
                <button class="btn btn-primary" type="button">Search</button>
            </form>
        </div>
    </nav>

    <div class="main">
        <div class="container">
            <div class="row">

                <div class="col-md-7">
                    <div class="hours">

                        <h5 class="text-center">School Office Hours</h5>

                        <table class="table table-bordered table-striped text-center">
                            <thead class="table-primary">
                                <tr>
                                    <th>Day</th>
                                    <th>Office Hours</th>
                                    <th>Department</th>
                                </tr>
                            </thead>

                            <tbody>
                                <tr>
                                    <td>Monday</td>
                                    <td>8:00 AM - 4:00 PM</td>
                                    <td>Registrar's Office</td>
                                </tr>

                                <tr>
                                    <td>Tuesday</td>
                                    <td>8:00 AM - 4:00 PM</td>
                                    <td>Accounting Office</td>
                                </tr>

                                <tr>
                                    <td>Wednesday</td>
                                    <td>8:00 AM - 4:00 PM</td>
                                    <td>Guidance Office</td>
                                </tr>

                                <tr>
                                    <td>Thursday</td>
                                    <td>8:00 AM - 4:00 PM</td>
                                    <td>Principal's Office</td>
                                </tr>

                                <tr>
                                    <td>Friday</td>
                                    <td>8:00 AM - 3:00 PM</td>
                                    <td>Admin Office</td>
                                </tr>
                            </tbody>
                        </table>

                    </div>
                </div>

                <!-- Contact Us Form -->
                <div class="col-md-4">
                    <div class="contact">

                        <h4>Contact Us</h4>

                        <form>
                            <div class="mb-2">
                                <label class="form-label">Full Name</label>
                                <input type="text" class="form-control" placeholder="Enter your full name">
                            </div>

                            <div class="mb-2">
                                <label class="form-label">Email Address</label>
                                <input type="email" class="form-control" placeholder="Enter your email">
                            </div>

                            <div class="mb-2">
                                <label class="form-label">Subject</label>
                                <input type="text" class="form-control" placeholder="Enter subject">
                            </div>

                            <div class="mb-3">
                                <label class="form-label">Message</label>
                                <textarea class="form-control" rows="4" placeholder="Type your message here"></textarea>
                            </div>

                            <button type="button" class="btn btn-primary">Send Message</button>
                        </form>

                    </div>
                </div>

            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
